<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight</p>
    </header>
    <main data-testid="board">
      <p class="status" role="status" hidden></p>
      <div data-testid="loader" class="loader" role="status" aria-live="polite"><span class="spinner"></span> Loading incidents…</div>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <ul data-testid="incident-list" class="list" aria-live="polite"></ul>
    </main>
    <aside data-testid="incident-panel" class="panel" aria-label="Incident" hidden>
      <button type="button" class="p-close" aria-label="Close">×</button>
      <p class="p-head"><span class="p-id"></span> <span class="p-sev"></span></p>
      <p class="p-what"></p>
      <p class="p-summary"></p>
      <p class="p-opened">Opened <time class="p-time"></time></p>
      <button type="button" data-testid="panel-ack" class="p-ack">Ack</button>
      <p class="p-acked" hidden></p>
    </aside>
    <footer>sched-prod incident board · build <code data-testid="build-sha">__BUILD_SHA__</code></footer>
  </body>
</html>
